name: Vesta 12-Post Production Controller

on:
  workflow_dispatch:
    inputs:
      command:
        description: Bounded controller iteration
        required: true
        default: resume
        type: choice
        options:
          - resume
          - status
          - stop
          - retry_failed
          - post_001
          - post_002
          - post_003
          - post_004
          - post_005
          - post_006
          - post_007
          - post_008
          - post_009
          - post_010
          - post_011
          - post_012
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: vesta-production-controller
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VESTA_ASSET_VOLUME_ID: ${{ vars.VESTA_ASSET_VOLUME_ID }}
      VESTA_ASSET_DATA_CENTER: ${{ vars.VESTA_ASSET_DATA_CENTER }}
      VESTA_EXECUTE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RunPod CLI for bounded render iterations
        run: |
          curl -fsSL https://cli.runpod.net | bash
          echo "$HOME/.runpod/bin" >> "$GITHUB_PATH"

      - name: Run one production iteration
        run: |
          command="${{ github.event.inputs.command || 'resume' }}"
          python3 scripts/vesta_cloud_orchestrator.py --command "$command" --repo "$GITHUB_REPOSITORY" --update-dashboard

      - name: Persist controller state and QC metadata
        run: |
          git config user.name "vesta-production-controller[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/cloud_state.json production/12post_20260930/reports
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(production): bounded cloud controller iteration"
          git push
