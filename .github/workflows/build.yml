name: Build Vesta MiniMax H3 Worker

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - vesta_start.sh
      - vesta_handler.py
      - extra_model_paths.yaml
      - workflows/**
      - config/**
      - scripts/**
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # runtime-v3 and runtime-v4 are rollback images. Do not retag or delete them.
      - name: Build and push slim runtime-v5
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jondon2/vesta-h3-runpod-worker:runtime-v5
            ghcr.io/jondon2/vesta-h3-runpod-worker:code
          provenance: false
