name: Build Vesta MiniMax H3 Worker

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - workflows/**
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push code image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jondon2/vesta-h3-runpod-worker:code
          provenance: false

      - name: Install crane and aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Append MiniMax H3 model layers
        shell: bash
        run: |
          set -euo pipefail
          crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          WORK=/mnt/weights
          sudo mkdir -p "$WORK"
          sudo chown "$USER" "$WORK"
          IMG=ghcr.io/jondon2/vesta-h3-runpod-worker
          BASE="$IMG:code"

          append_weight() {
            subdir="$1"
            filename="$2"
            url="$3"
            mkdir -p "$WORK/stage/comfyui/models/$subdir"
            aria2c -x16 -s16 -k1M --console-log-level=warn --dir="$WORK/stage/comfyui/models/$subdir" -o "$filename" "$url"
            tar --owner=0 --group=0 -cf "$WORK/layer.tar" -C "$WORK/stage" comfyui
            rm -rf "$WORK/stage"
            crane append -b "$BASE" -f "$WORK/layer.tar" -t "$IMG:wip"
            rm -f "$WORK/layer.tar"
            BASE="$IMG:wip"
          }

          append_weight diffusion_models minimax_h3_fl2va_pruned_int8_convrot.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors

          append_weight text_encoders qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors

          append_weight vae minimax_h3_video_vae_fp16.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors

          append_weight vae minimax_h3_audio_vae_fp32.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors

          crane tag "$IMG:wip" latest
