runpod_worker_comfy:
  base_path: /runpod-volume
  checkpoints: models/checkpoints/
  clip: models/clip/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  diffusion_models: models/diffusion_models/
  embeddings: models/embeddings/
  loras: models/loras/
  text_encoders: models/text_encoders/
  upscale_models: models/upscale_models/
  vae: models/vae/
  unet: models/unet/
  # H3 lives under diffusion_models / text_encoders / vae on this volume.
  # SeedVR2 4K (native ComfyUI v0.30.1, not numz custom nodes) also uses
  # those folders — do not put weights in upscale_models:
  #   models/diffusion_models/seedvr2_3b_int8_convrot.safetensors
  #   models/vae/seedvr2_ema_vae_fp16.safetensors
  # Listing stills are not models. ComfyUI --input-directory is
  # /runpod-volume/input (LoadImage <file>, last_frames/<file>,
  # LoadVideo vesta_renders/<file>). Do not symlink those into /comfyui/input.
  # ComfyUI --output-directory is /runpod-volume/output/vesta (the real
  # SaveImage/SaveVideo root). Do not symlink /comfyui/output.
